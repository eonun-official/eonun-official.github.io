<!-- 全站色彩系统 v2：取色器 → 选定色 + 相邻色相渐变；作用于页面背景(最淡)与标题渐变字，正文不受染 -->
<style>
#palette-toggle {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #0a0a0a;
  border: 1px solid rgba(255, 255, 255, 0.7);
  color: #f5f5f5;
  font-size: 20px;
  line-height: 42px;
  text-align: center;
  cursor: pointer;
  z-index: 99999;
  user-select: none;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
#palette-toggle:hover {
  transform: scale(1.08);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
}
#palette-panel {
  position: fixed;
  right: 20px;
  bottom: 76px;
  width: 224px;
  background: rgba(10, 10, 10, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 12px;
  padding: 16px 16px 12px;
  z-index: 99999;
  display: none;
  backdrop-filter: blur(8px);
}
#palette-panel.open { display: block; }
#palette-panel .pp-title {
  color: #f5f5f5;
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-align: center;
}
#palette-panel .pp-picker {
  width: 100%;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 8px;
  background: transparent;
  padding: 2px;
  cursor: pointer;
  margin-bottom: 12px;
  display: block;
}
#palette-panel .pp-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
#palette-panel .pp-label {
  color: #999;
  font-size: 11px;
  white-space: nowrap;
}
#palette-panel input[type="range"] {
  flex: 1;
  accent-color: #f5f5f5;
  height: 14px;
}
#palette-panel .pp-reset {
  color: #999;
  font-size: 11px;
  text-align: center;
  cursor: pointer;
  padding-top: 2px;
  transition: color 0.2s ease;
}
#palette-panel .pp-reset:hover { color: #f5f5f5; }
</style>
<div id="palette-toggle" title="色彩系统">◐</div>
<div id="palette-panel">
  <div class="pp-title">色 彩 系 统</div>
  <input type="color" id="pp-picker" class="pp-picker" value="#7b5cd6">
  <div class="pp-row">
    <span class="pp-label">染色浓度</span>
    <input type="range" id="pp-intensity" min="5" max="100" value="25">
  </div>
  <div class="pp-reset" id="pp-reset">恢复黑白</div>
</div>
<script>
(function () {
  var KEY = 'eonun-tint';
  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255,
        g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    function to(v) { return ('0' + Math.round((v + m) * 255).toString(16)).slice(-2); }
    return '#' + to(r) + to(g) + to(b);
  }
  /* 相邻色：色相 +28°、明度 +8%，得到相近的渐变伙伴 */
  function adjacent(hex) {
    var hsl = hexToHsl(hex);
    return hslToHex(hsl[0] + 28, Math.min(hsl[1], 80), Math.min(hsl[2] + 8, 85));
  }
  function alpha(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')';
  }
  function apply(hex, intensity, persist) {
    var root = document.documentElement;
    var body = document.body;
    if (!hex) {
      root.style.removeProperty('--trance-purple');
      root.style.removeProperty('--trance-blue');
      root.style.removeProperty('--glow-color');
      if (body) body.style.removeProperty('background-image');
    } else {
      var c2 = adjacent(hex);
      root.style.setProperty('--trance-purple', hex);
      root.style.setProperty('--trance-blue', c2);
      root.style.setProperty('--glow-color', alpha(hex, 0.38));
      var a = (0.05 + 0.20 * (intensity / 100)).toFixed(3); /* 背景保持最淡 */
      if (body) body.style.setProperty('background-image',
        'linear-gradient(160deg, ' + alpha(hex, a) + ' 0%, rgba(0,0,0,0) 45%, ' + alpha(c2, a) + ' 100%)', 'important');
    }
    if (persist !== false) { try { localStorage.setItem(KEY, JSON.stringify({ hex: hex, i: intensity })); } catch (e) {} }
  }
  /* 全局钩子：其他模块（如 instructions 分区导航）可直接驱动色彩系统，不写 localStorage */
  window.eonunApplyTint = function (hex, intensity) { apply(hex, intensity, false); };
  /* 从黑白（浓度 0）缓动渐变到目标色，duration 毫秒，不写 localStorage */
  function animateFromZero(hex, intensity, duration) {
    var t0 = null;
    function frame(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / duration, 1);
      var e = 1 - Math.pow(1 - p, 3); /* easeOutCubic */
      var root = document.documentElement, body = document.body;
      var c2 = adjacent(hex);
      root.style.setProperty('--trance-purple', hex);
      root.style.setProperty('--trance-blue', c2);
      root.style.setProperty('--glow-color', alpha(hex, (0.38 * e).toFixed(3)));
      var a = (0.05 + 0.20 * ((intensity * e) / 100)).toFixed(3);
      body.style.setProperty('background-image',
        'linear-gradient(160deg, ' + alpha(hex, a) + ' 0%, rgba(0,0,0,0) 45%, ' + alpha(c2, a) + ' 100%)', 'important');
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  /* 主页：视频真正开始播放时，从灰渐变到随机色（饱和度/明度取参考紫 #7637c3 的 HSL：54%/49%，浓度 50%，4 秒） */
  function randomHomeHex() {
    return hslToHex(Math.random() * 360, 54, 49);
  }
  var picker = document.getElementById('pp-picker');
  var slider = document.getElementById('pp-intensity');
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (document.body.classList.contains('is-home')) {
    /* 主页：视频真正开播后，颜色渐变跟随视频播放进度（前 4 秒），已存配色优先，否则随机色 */
    var target = (saved && saved.hex) ? { hex: saved.hex, i: saved.i || 25 } : { hex: randomHomeHex(), i: 50 };
    picker.value = target.hex;
    slider.value = target.i;
    var fired = false;
    function startHomeTint() {
      if (fired) return;
      fired = true;
      var root = document.documentElement, body = document.body;
      var c2 = adjacent(target.hex);
      function paint(e) {
        root.style.setProperty('--trance-purple', target.hex);
        root.style.setProperty('--trance-blue', c2);
        root.style.setProperty('--glow-color', alpha(target.hex, (0.38 * e).toFixed(3)));
        var a = (0.05 + 0.20 * ((target.i * e) / 100)).toFixed(3);
        body.style.setProperty('background-image',
          'linear-gradient(160deg, ' + alpha(target.hex, a) + ' 0%, rgba(0,0,0,0) 45%, ' + alpha(c2, a) + ' 100%)', 'important');
      }
      /* 渐变进度 = 视频当前播放时间 / 4s：视频缓冲卡顿则颜色同步停住，不偷跑时间 */
      function onTime() {
        var p = Math.min(hv.currentTime / 4, 1);
        paint(1 - Math.pow(1 - p, 3));
        if (p >= 1) hv.removeEventListener('timeupdate', onTime);
      }
      paint(0);
      hv.addEventListener('timeupdate', onTime);
      /* 兜底：视频长期卡死时，10 秒后强制到位 */
      setTimeout(function () { paint(1); hv.removeEventListener('timeupdate', onTime); }, 10000);
    }
    var hv = document.getElementById('header-video');
    if (hv) {
      if (!hv.paused && hv.readyState >= 2) startHomeTint(); /* 已在播放（缓存命中） */
      hv.addEventListener('playing', startHomeTint);
    } else {
      animateFromZero(target.hex, target.i, 4000);
    }
  } else if (saved && saved.hex) {
    picker.value = saved.hex;
    slider.value = saved.i || 25;
    apply(saved.hex, saved.i || 25);
  }
  document.getElementById('palette-toggle').addEventListener('click', function () {
    document.getElementById('palette-panel').classList.toggle('open');
  });
  picker.addEventListener('input', function () {
    apply(this.value, parseInt(slider.value, 10));
  });
  slider.addEventListener('input', function () {
    if (picker.value) apply(picker.value, parseInt(this.value, 10));
  });
  document.getElementById('pp-reset').addEventListener('click', function () {
    apply('', 25);
    picker.value = '#7b5cd6';
    slider.value = 25;
  });
})();
</script>
