baseURL = 'http://localhost:1313/'
title = 'Eonun'
defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = false

# 原始 HTML 直接写入 Markdown 内容（content/*.md 中为整页 HTML）
[markup.goldmark.renderer]
unsafe = true

# 本站不用分类/标签，禁止生成 categories/、tags/ 空目录
disableKinds = ['taxonomy', 'term']
relativeURLs = true

# 多语言：简体(根目录) / 繁体 / 英语 / 德语
[languages]
  [languages.zh-cn]
    languageName = '简体中文'
    languageCode = 'zh-CN'
    weight = 1
    contentDir = 'content/zh-cn'
  [languages.zh-tw]
    languageName = '繁體中文'
    languageCode = 'zh-TW'
    weight = 2
    contentDir = 'content/zh-tw'
  [languages.en]
    languageName = 'English'
    languageCode = 'en'
    weight = 3
    contentDir = 'content/en'
  [languages.de]
    languageName = 'Deutsch'
    languageCode = 'de'
    weight = 4
    contentDir = 'content/de'

[[menu.main]]
  name = "Shop"
  url = "/shop/"
  weight = 1
[[menu.main]]
  name = "Music Services"
  url = "/music-services/"
  weight = 2
[[menu.main]]
  name = "Instructions"
  url = "/instructions/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5
